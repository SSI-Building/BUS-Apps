<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวางแผนงานประจำวัน (Drag & Drop)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 🌟 API URL ของคุณ 🌟
        const API_URL = "https://script.google.com/macros/s/AKfycbwL-PUhAA0TquLsuI6EnmDer9Dvo13xhCz7oIlXdFCzcxf0dFyY_D9GVKDi44gSoP9kpw/exec";

        // 🌟 เอาตัวอย่างงานสมชายออก เปลี่ยนเป็นตารางว่างๆ 🌟
        const initialTasks = [];

        function App() {
            const [availableEmployees, setAvailableEmployees] = useState([]);
            const [tasks, setTasks] = useState(initialTasks);
            const [date, setDate] = useState(new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }));
            const [isLoading, setIsLoading] = useState(true);
            const [fetchError, setFetchError] = useState(""); 
            const [newTaskForm, setNewTaskForm] = useState({ number: '', name: '', owner: '' });
            const [dragOverTaskId, setDragOverTaskId] = useState(null);

            useEffect(() => { lucide.createIcons(); });

            useEffect(() => {
                const fetchEmployees = async () => {
                    try {
                        setIsLoading(true);
                        setFetchError("");
                        
                        const response = await fetch(`${API_URL}?action=getEmployees&t=${Date.now()}`);
                        
                        if (!response.ok) {
                            throw new Error("การตั้งค่าสิทธิ์ Apps Script ไม่ถูกต้อง (CORS Blocked)");
                        }

                        const result = await response.json();
                        
                        let empList = [];
                        if (Array.isArray(result)) {
                            empList = result;
                        } else if (result.success === false) {
                            throw new Error(result.message || "เกิดข้อผิดพลาดจากฝั่ง Google Sheets");
                        } else if (result.data && Array.isArray(result.data)) {
                            empList = result.data;
                        }

                        if (empList.length > 0) {
                            const assignedIds = new Set(tasks.flatMap(t => t.assignees.map(a => a.id)));
                            const freeEmployees = empList.filter(emp => !assignedIds.has(emp.id));
                            setAvailableEmployees(freeEmployees);
                        } else {
                            setFetchError("ไม่พบรายชื่อพนักงานแผนก Cleaning ในตาราง");
                        }
                    } catch (error) {
                        console.error("ดึงข้อมูลไม่สำเร็จ:", error);
                        setFetchError(error.message || "เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ");
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchEmployees();
            }, []);

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTaskForm.number || !newTaskForm.name) return;
                const newTask = {
                    id: `task-${Date.now()}`, number: newTaskForm.number,
                    name: newTaskForm.name, owner: newTaskForm.owner, assignees: []
                };
                setTasks([...tasks, newTask]);
                setNewTaskForm({ number: '', name: '', owner: '' });
            };

            const handleDeleteTask = (taskId) => {
                if (confirm('คุณต้องการลบงานนี้ใช่หรือไม่?')) {
                    const taskToDelete = tasks.find(t => t.id === taskId);
                    if (taskToDelete && taskToDelete.assignees.length > 0) {
                        setAvailableEmployees(prev => [...prev, ...taskToDelete.assignees]);
                    }
                    setTasks(tasks.filter(t => t.id !== taskId));
                }
            };

            const handleDragStart = (e, employee) => {
                e.dataTransfer.setData('application/json', JSON.stringify(employee));
                e.dataTransfer.effectAllowed = 'copy';
            };

            const handleDragOver = (e, taskId) => {
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'copy';
                if (dragOverTaskId !== taskId) setDragOverTaskId(taskId);
            };

            const handleDragLeave = (e, taskId) => {
                e.preventDefault();
                if (dragOverTaskId === taskId) setDragOverTaskId(null);
            };

            const handleDrop = (e, taskId) => {
                e.preventDefault();
                setDragOverTaskId(null);
                const employeeDataString = e.dataTransfer.getData('application/json');
                if (!employeeDataString) return;
                const employee = JSON.parse(employeeDataString);

                setTasks(prevTasks => prevTasks.map(task => {
                    if (task.id === taskId) {
                        const isAlreadyAssigned = task.assignees.some(emp => emp.id === employee.id);
                        if (!isAlreadyAssigned) return { ...task, assignees: [...task.assignees, employee] };
                    }
                    return task;
                }));
                setAvailableEmployees(prev => prev.filter(emp => emp.id !== employee.id));
            };

            const removeAssignee = (taskId, employee) => {
                setTasks(prevTasks => prevTasks.map(task => {
                    if (task.id === taskId) {
                        return { ...task, assignees: task.assignees.filter(emp => emp.id !== employee.id) };
                    }
                    return task;
                }));
                setAvailableEmployees(prev => [...prev, employee]);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center">
                            <div className="flex items-center gap-3 mb-4 sm:mb-0">
                                <div className="bg-blue-600 p-2 rounded-lg shadow-sm">
                                    <i data-lucide="clipboard-list" className="w-6 h-6 text-white"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800 tracking-tight">แผนงานประจำวัน</h1>
                                    <p className="text-sm text-gray-500">ลากรายชื่อเพื่อมอบหมายงาน</p>
                                </div>
                            </div>
                            <div className="flex items-center bg-gray-50 border border-gray-200 px-4 py-2 rounded-lg shadow-sm">
                                <i data-lucide="calendar" className="w-5 h-5 text-blue-500 mr-2"></i>
                                <input 
                                    type="text" value={date} onChange={(e) => setDate(e.target.value)}
                                    className="bg-transparent border-none outline-none font-medium text-gray-700 w-32"
                                />
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col md:flex-row gap-6 lg:gap-8">
                        {/* กล่องรายชื่อพนักงาน */}
                        <div className="w-full md:w-1/3 lg:w-1/4">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 sticky top-24">
                                <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center border-b border-gray-100 pb-3">
                                    <i data-lucide="users" className="w-5 h-5 mr-2 text-blue-500"></i>
                                    รายชื่อพนักงาน
                                </h2>
                                
                                <div className="flex flex-wrap gap-2 max-h-[60vh] overflow-y-auto pb-2 pr-1">
                                    {isLoading ? (
                                        <div className="w-full text-center py-8 text-sm text-gray-500 flex flex-col items-center">
                                            <i data-lucide="loader-2" className="w-8 h-8 animate-spin text-blue-500 mb-3"></i>
                                            กำลังโหลดข้อมูล...
                                        </div>
                                    ) : fetchError ? (
                                        <div className="w-full text-center py-4 px-2 text-sm text-red-600 bg-red-50 rounded-lg border border-red-100">
                                            <i data-lucide="alert-circle" className="w-6 h-6 mx-auto mb-2 text-red-500"></i>
                                            <p className="font-semibold">ข้อผิดพลาด:</p>
                                            <p>{fetchError}</p>
                                        </div>
                                    ) : availableEmployees.length === 0 ? (
                                        <div className="w-full text-center py-6 text-sm text-green-600 bg-green-50 rounded-lg border border-green-100">
                                            <i data-lucide="check-circle-2" className="w-6 h-6 mx-auto mb-2 text-green-500"></i>
                                            มอบหมายงานครบทุกคนแล้ว!
                                        </div>
                                    ) : (
                                        availableEmployees.map(employee => (
                                            <div
                                                key={employee.id} draggable
                                                onDragStart={(e) => handleDragStart(e, employee)}
                                                className="bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 px-3 py-2.5 rounded-lg cursor-grab active:cursor-grabbing transition-colors flex items-center shadow-sm w-[calc(50%-0.25rem)] lg:w-full group"
                                            >
                                                <i data-lucide="grip-vertical" className="w-4 h-4 mr-2 text-blue-400 opacity-50 group-hover:opacity-100"></i>
                                                <span className="font-medium text-sm truncate">{employee.name}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* กล่องรายการงาน */}
                        <div className="w-full md:w-2/3 lg:w-3/4 flex flex-col gap-6">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center border-b border-gray-100 pb-3">
                                    <i data-lucide="plus-circle" className="w-5 h-5 mr-2 text-green-500"></i>
                                    เพิ่มงานใหม่
                                </h2>
                                <form onSubmit={handleAddTask} className="flex flex-col sm:flex-row gap-4 items-start sm:items-end">
                                    <div className="w-full sm:w-24">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">หมายเลข</label>
                                        <input type="text" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all" value={newTaskForm.number} onChange={(e) => setNewTaskForm({...newTaskForm, number: e.target.value})} placeholder="ลำดับ" />
                                    </div>
                                    <div className="w-full sm:flex-1">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">ชื่องาน</label>
                                        <input type="text" required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all" value={newTaskForm.name} onChange={(e) => setNewTaskForm({...newTaskForm, name: e.target.value})} placeholder="รายละเอียดงาน..." />
                                    </div>
                                    <div className="w-full sm:w-48">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1 uppercase tracking-wider">เจ้าของงาน</label>
                                        <input type="text" className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all" value={newTaskForm.owner} onChange={(e) => setNewTaskForm({...newTaskForm, owner: e.target.value})} placeholder="ชื่อ (ไม่บังคับ)" />
                                    </div>
                                    <button type="submit" className="w-full sm:w-auto bg-gray-800 hover:bg-gray-900 text-white px-6 py-2 rounded-lg font-medium transition-colors text-sm shadow-md hover:shadow-lg flex justify-center items-center h-[38px]">
                                        เพิ่มงาน
                                    </button>
                                </form>
                            </div>

                            <div className="space-y-4">
                                {tasks.map((task) => (
                                    <div key={task.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden group hover:border-blue-300 transition-colors">
                                        <div className="flex flex-col sm:flex-row border-b border-gray-100">
                                            <div className="p-4 sm:p-5 flex-1 flex flex-col justify-center">
                                                <div className="flex items-start justify-between">
                                                    <div className="flex items-start gap-3">
                                                        <span className="bg-blue-100 text-blue-700 font-bold px-2.5 py-1 rounded-md text-sm mt-0.5 border border-blue-200">
                                                            #{task.number}
                                                        </span>
                                                        <div>
                                                            <h3 className="font-semibold text-gray-800 text-lg leading-tight">{task.name}</h3>
                                                            {task.owner && (
                                                                <p className="text-sm text-gray-500 mt-1.5 flex items-center">
                                                                    <i data-lucide="briefcase" className="w-3.5 h-3.5 mr-1.5 text-gray-400"></i>
                                                                    เจ้าของงาน: <span className="ml-1 text-gray-700 font-medium">{task.owner}</span>
                                                                </p>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <button onClick={() => handleDeleteTask(task.id)} className="text-gray-400 hover:text-white hover:bg-red-500 p-1.5 rounded-md opacity-0 group-hover:opacity-100 transition-all ml-2" title="ลบงาน">
                                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                            </div>

                                            <div 
                                                className={`p-4 sm:w-64 border-t sm:border-t-0 sm:border-l border-gray-100 transition-all duration-200 ${dragOverTaskId === task.id ? 'bg-blue-50/50 shadow-[inset_0_0_0_2px_#93c5fd]' : 'bg-gray-50/50'}`}
                                                onDragOver={(e) => handleDragOver(e, task.id)} onDragLeave={(e) => handleDragLeave(e, task.id)} onDrop={(e) => handleDrop(e, task.id)}
                                            >
                                                <div className="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide flex justify-between items-center">
                                                    <span>ผู้ปฏิบัติงาน</span>
                                                    <span className="bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full text-[10px]">{task.assignees.length} คน</span>
                                                </div>
                                                
                                                <div className={`min-h-[70px] rounded-lg border-2 border-dashed transition-colors ${dragOverTaskId === task.id ? 'border-blue-400 bg-blue-50' : 'border-gray-300 bg-white'} flex flex-wrap gap-2 p-2.5 items-center ${task.assignees.length === 0 ? 'justify-center' : 'justify-start'}`}>
                                                    {task.assignees.length === 0 && (
                                                        <span className="text-xs text-gray-400 text-center pointer-events-none flex flex-col items-center">
                                                            <i data-lucide="download" className="w-4 h-4 mb-1 opacity-50"></i> ลากรายชื่อมาวาง
                                                        </span>
                                                    )}
                                                    {task.assignees.map(emp => (
                                                        <div key={emp.id} className="bg-white border border-green-200 text-green-700 shadow-sm rounded-full pl-3 pr-1 py-1 text-[13px] font-medium flex items-center gap-1.5 hover:border-green-300 hover:shadow transition-all">
                                                            {emp.name}
                                                            <button onClick={() => removeAssignee(task.id, emp)} className="hover:bg-green-100 text-green-500 hover:text-green-700 rounded-full p-0.5 transition-colors">
                                                                <i data-lucide="x" className="w-3.5 h-3.5"></i>
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}

                                {tasks.length === 0 && (
                                    <div className="text-center py-16 bg-white rounded-xl border-2 border-dashed border-gray-200">
                                        <div className="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i data-lucide="clipboard-x" className="w-8 h-8 text-gray-400"></i>
                                        </div>
                                        <h3 className="text-lg font-medium text-gray-900 mb-1">ยังไม่มีรายการงาน</h3>
                                        <p className="text-sm text-gray-500">เริ่มต้นโดยการกรอกรายละเอียดงานด้านบน แล้วกดเพิ่มงาน</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
