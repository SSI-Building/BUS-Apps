<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวางแผนงานประจำวัน (Drag & Drop)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbwL-PUhAA0TquLsuI6EnmDer9Dvo13xhCz7oIlXdFCzcxf0dFyY_D9GVKDi44gSoP9kpw/exec";

        const getTodayISO = () => {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };

        const formatThaiDate = (isoString) => {
            if (!isoString) return "";
            const [year, month, day] = isoString.split('-');
            const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `${parseInt(day, 10)} ${months[parseInt(month, 10) - 1]} ${parseInt(year, 10) + 543}`;
        };

        function App() {
            const [allEmployees, setAllEmployees] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [date, setDate] = useState(getTodayISO()); 
            
            const [activeTab, setActiveTab] = useState("Cleaning"); 

            const [isLoadingEmp, setIsLoadingEmp] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [isFetchingPlan, setIsFetchingPlan] = useState(false);
            
            const [newTaskForm, setNewTaskForm] = useState({ number: '', name: '', owner: '', period: 'full' });
            const [dragOverTaskId, setDragOverTaskId] = useState(null);

            useEffect(() => { lucide.createIcons(); });

            // 1. โหลดรายชื่อพนักงานทั้งหมดเมื่อเปิดเว็บ (ทำแค่ครั้งเดียว)
            useEffect(() => {
                const fetchEmployees = async () => {
                    try {
                        setIsLoadingEmp(true);
                        const response = await fetch(`${API_URL}?action=getEmployees&t=${Date.now()}`);
                        const result = await response.json();
                        if (Array.isArray(result)) setAllEmployees(result);
                    } catch (error) {
                        console.error(error);
                    } finally {
                        setIsLoadingEmp(false);
                    }
                };
                fetchEmployees();
            }, []);

            // 🌟 2. ระบบโหลดแผนงาน "อัตโนมัติ" ทุกครั้งที่เปลี่ยนวันที่ (date เปลี่ยน = ดึงข้อมูลใหม่ทันที) 🌟
            useEffect(() => {
                const loadPlanForDate = async () => {
                    try {
                        setIsFetchingPlan(true);
                        setTasks([]); // เคลียร์ตารางรอรับข้อมูลใหม่
                        
                        const thaiDateStr = formatThaiDate(date);
                        const response = await fetch(`${API_URL}?action=getWorkPlan&date=${encodeURIComponent(thaiDateStr)}&t=${Date.now()}`);
                        const planData = await response.json();

                        if (!planData || planData.length === 0) {
                            // วันที่ยังไม่มีแผนงาน ก็ปล่อยให้ตารางว่างๆ ไว้
                            setTasks([]);
                            return;
                        }

                        // ถอดรหัสข้อมูลมาเรียงในกล่องงาน
                        const taskMap = {};
                        planData.forEach(row => {
                            let pCode = 'full';
                            if (row.taskPeriod === 'ครึ่งวันเช้า') pCode = 'morning';
                            if (row.taskPeriod === 'ครึ่งวันบ่าย') pCode = 'afternoon';
                            
                            const key = `${row.taskNumber}-${row.taskName}-${pCode}`;
                            if (!taskMap[key]) {
                                taskMap[key] = {
                                    id: `loaded-${Date.now()}-${Math.random()}`,
                                    number: row.taskNumber,
                                    name: row.taskName,
                                    owner: row.taskOwner,
                                    period: pCode,
                                    assignees: []
                                };
                            }
                            taskMap[key].assignees.push({ id: row.empId, name: row.empName, lineId: row.lineId });
                        });
                        
                        setTasks(Object.values(taskMap));
                    } catch (error) {
                        console.error("ไม่สามารถดึงข้อมูลแผนงานได้");
                    } finally {
                        setIsFetchingPlan(false);
                    }
                };

                loadPlanForDate();
            }, [date]); // <-- เมื่อค่า date เปลี่ยน คำสั่งนี้จะทำงานอัตโนมัติ

            // ฟังก์ชันเช็คสถานะการรับงานของพนักงานแต่ละคน
            const getEmployeeStatus = (empId) => {
                let status = { full: false, morning: false, afternoon: false };
                tasks.forEach(t => {
                    if (t.assignees.some(a => a.id === empId)) {
                        if (t.period === 'full') status.full = true;
                        if (t.period === 'morning') status.morning = true;
                        if (t.period === 'afternoon') status.afternoon = true;
                    }
                });
                return status;
            };

            // กรองพนักงานเพื่อแสดงในฝั่งซ้าย (อิงจากข้อมูลวันที่เลือก)
            const visibleEmployees = allEmployees.filter(emp => {
                if (emp.department !== activeTab) return false;
                const status = getEmployeeStatus(emp.id);
                return !status.full && !(status.morning && status.afternoon);
            });

            // บันทึกและเขียนทับแผนงาน
            const handleSavePlan = async () => {
                const planData = [];
                const thaiDateStr = formatThaiDate(date); 

                tasks.forEach(task => {
                    if (task.assignees.length > 0) {
                        let periodText = 'เต็มวัน';
                        if (task.period === 'morning') periodText = 'ครึ่งวันเช้า';
                        if (task.period === 'afternoon') periodText = 'ครึ่งวันบ่าย';

                        task.assignees.forEach(emp => {
                            planData.push({
                                empId: emp.id, empName: emp.name, lineId: emp.lineId || "",
                                taskNumber: task.number, taskName: task.name,
                                taskOwner: task.owner, taskPeriod: periodText, workDate: thaiDateStr 
                            });
                        });
                    }
                });

                if (planData.length === 0) {
                    if(!confirm(`ตารางงานว่างเปล่า ระบบจะลบข้อมูลของวันที่ ${thaiDateStr} ทิ้ง ยืนยันหรือไม่?`)) return;
                } else {
                    if (!confirm(`ยืนยันการบันทึกแผนงานของวันที่ ${thaiDateStr} ลงระบบ? (ของเก่าจะถูกทับ)`)) return;
                }

                try {
                    setIsSaving(true);
                    const response = await fetch(API_URL, {
                        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "saveWorkPlan", planData: planData, workDate: thaiDateStr })
                    });
                    const result = await response.json();
                    if (result.success) alert("อัปเดตและบันทึกข้อมูลเรียบร้อยแล้ว!");
                    else alert("เกิดข้อผิดพลาด: " + result.message);
                } catch (error) {
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTaskForm.number || !newTaskForm.name) return;
                setTasks([...tasks, { id: `task-${Date.now()}`, number: newTaskForm.number, name: newTaskForm.name, owner: newTaskForm.owner, period: newTaskForm.period, assignees: [] }]);
                setNewTaskForm({ number: '', name: '', owner: '', period: 'full' });
            };

            const handleUpdateTaskField = (taskId, field, value) => {
                setTasks(prev => prev.map(t => t.id === taskId ? { ...t, [field]: value } : t));
            };

            const handleDeleteTask = (taskId) => {
                if (confirm('คุณต้องการลบงานนี้ใช่หรือไม่?')) setTasks(tasks.filter(t => t.id !== taskId));
            };

            const handleDragStart = (e, employee) => {
                e.dataTransfer.setData('application/json', JSON.stringify(employee));
            };

            const handleDrop = (e, taskId) => {
                e.preventDefault();
                setDragOverTaskId(null);
                const empStr = e.dataTransfer.getData('application/json');
                if (!empStr) return;
                
                const employee = JSON.parse(empStr);
                const targetTask = tasks.find(t => t.id === taskId);
                const empStatus = getEmployeeStatus(employee.id);

                if (targetTask.period === 'full' && (empStatus.morning || empStatus.afternoon)) {
                    alert(`ไม่สามารถจัดลงงาน "เต็มวัน" ได้ เนื่องจากมีงานครึ่งวันแล้ว`); return;
                }
                if (targetTask.period === 'morning' && empStatus.morning) { alert(`รับงาน "ช่วงเช้า" ไปแล้ว`); return; }
                if (targetTask.period === 'afternoon' && empStatus.afternoon) { alert(`รับงาน "ช่วงบ่าย" ไปแล้ว`); return; }

                setTasks(prev => prev.map(t => {
                    if (t.id === taskId && !t.assignees.some(emp => emp.id === employee.id)) {
                        return { ...t, assignees: [...t.assignees, employee] };
                    }
                    return t;
                }));
            };

            const removeAssignee = (taskId, employee) => {
                setTasks(prev => prev.map(t => t.id === taskId ? { ...t, assignees: t.assignees.filter(emp => emp.id !== employee.id) } : t));
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg shadow-sm">
                                    <i data-lucide="clipboard-list" className="w-6 h-6 text-white"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800 tracking-tight">แผนงานประจำวัน</h1>
                                    <p className="text-sm text-gray-500">สร้าง ดูย้อนหลัง หรือแก้ไขแผนงาน</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 flex-wrap">
                                {/* 🌟 กล่องเลือกวันที่ เปลี่ยนปุ๊บ โหลดปั๊บ 🌟 */}
                                <div className="flex items-center bg-gray-50 border border-gray-200 px-3 py-2 rounded-lg shadow-sm focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                                    <input 
                                        type="date" 
                                        value={date} 
                                        onChange={(e) => setDate(e.target.value)} 
                                        className="bg-transparent border-none outline-none font-medium text-gray-700 w-36 cursor-pointer" 
                                    />
                                    {isFetchingPlan && <i data-lucide="loader-2" className="w-4 h-4 text-blue-500 animate-spin ml-2"></i>}
                                </div>
                                <button onClick={handleSavePlan} disabled={isSaving || isFetchingPlan} className="bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-md flex items-center gap-2">
                                    {isSaving ? <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i> : <i data-lucide="save" className="w-5 h-5"></i>}
                                    {isSaving ? "กำลังบันทึก..." : "บันทึกอัปเดต"}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col md:flex-row gap-6 lg:gap-8">
                        
                        {/* ฝั่งซ้าย: กล่องรายชื่อพนักงาน */}
                        <div className="w-full md:w-1/3 lg:w-1/4">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-0 sticky top-24 overflow-hidden">
                                <div className="p-4 border-b border-gray-100 bg-gray-50">
                                    <h2 className="text-lg font-bold text-gray-800 flex items-center">
                                        <i data-lucide="users" className="w-5 h-5 mr-2 text-blue-500"></i>รายชื่อพนักงาน
                                    </h2>
                                </div>

                                {/* แท็บเมนู */}
                                <div className="flex border-b border-gray-200 bg-white">
                                    <button 
                                        onClick={() => setActiveTab("Cleaning")}
                                        className={`flex-1 py-3 text-sm font-semibold text-center border-b-2 transition-colors duration-200 ${activeTab === "Cleaning" ? "border-blue-500 text-blue-600 bg-blue-50/30" : "border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50"}`}
                                    >
                                        Cleaning
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab("คนสวน")}
                                        className={`flex-1 py-3 text-sm font-semibold text-center border-b-2 transition-colors duration-200 ${activeTab === "คนสวน" ? "border-green-500 text-green-600 bg-green-50/30" : "border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50"}`}
                                    >
                                        คนสวน
                                    </button>
                                </div>

                                <div className="p-4">
                                    <div className="flex flex-wrap gap-2 max-h-[55vh] overflow-y-auto pb-2 pr-1">
                                        {isLoadingEmp || isFetchingPlan ? (
                                            <div className="w-full text-center py-8 text-sm text-gray-500"><i data-lucide="loader-2" className="w-8 h-8 animate-spin text-blue-500 mx-auto mb-3"></i>กำลังโหลด...</div>
                                        ) : visibleEmployees.length === 0 ? (
                                            <div className="w-full text-center py-6 text-sm text-gray-500 border border-dashed rounded-lg bg-gray-50">
                                                ไม่มีพนักงานว่างในแผนกนี้
                                            </div>
                                        ) : (
                                            visibleEmployees.map(employee => {
                                                const status = getEmployeeStatus(employee.id);
                                                const boxColor = employee.department === "Cleaning" 
                                                    ? "bg-blue-50 hover:bg-blue-100 border-blue-200 text-blue-800" 
                                                    : "bg-green-50 hover:bg-green-100 border-green-200 text-green-800";
                                                const iconColor = employee.department === "Cleaning" ? "text-blue-400" : "text-green-500";

                                                return (
                                                    <div key={employee.id} draggable onDragStart={(e) => handleDragStart(e, employee)}
                                                        className={`border px-3 py-2.5 rounded-lg cursor-grab active:cursor-grabbing flex items-center shadow-sm w-[calc(50%-0.25rem)] lg:w-full group ${boxColor}`}
                                                    >
                                                        <i data-lucide="grip-vertical" className={`w-4 h-4 mr-2 opacity-50 group-hover:opacity-100 ${iconColor}`}></i>
                                                        <span className="font-medium text-sm truncate flex-1">{employee.name}</span>
                                                        {status.morning && <span className="ml-2 text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded font-bold">มีงานเช้า</span>}
                                                        {status.afternoon && <span className="ml-2 text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold">มีงานบ่าย</span>}
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* ขวา: กล่องรายการงาน */}
                        <div className="w-full md:w-2/3 lg:w-3/4 flex flex-col gap-6">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center border-b border-gray-100 pb-3">
                                    <i data-lucide="plus-circle" className="w-5 h-5 mr-2 text-blue-500"></i>เพิ่มงานใหม่
                                </h2>
                                <form onSubmit={handleAddTask} className="flex flex-col sm:flex-row gap-4 items-start sm:items-end">
                                    <div className="w-full sm:w-20">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">หมายเลข</label>
                                        <input type="text" required className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none" value={newTaskForm.number} onChange={(e) => setNewTaskForm({...newTaskForm, number: e.target.value})} placeholder="ลำดับ" />
                                    </div>
                                    <div className="w-full sm:w-32">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">ช่วงเวลา</label>
                                        <select className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none bg-white" value={newTaskForm.period} onChange={(e) => setNewTaskForm({...newTaskForm, period: e.target.value})}>
                                            <option value="full">เต็มวัน</option>
                                            <option value="morning">ครึ่งวันเช้า</option>
                                            <option value="afternoon">ครึ่งวันบ่าย</option>
                                        </select>
                                    </div>
                                    <div className="w-full sm:flex-1">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">ชื่องาน</label>
                                        <input type="text" required className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none" value={newTaskForm.name} onChange={(e) => setNewTaskForm({...newTaskForm, name: e.target.value})} placeholder="รายละเอียดงาน..." />
                                    </div>
                                    <div className="w-full sm:w-40">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">เจ้าของงาน</label>
                                        <input type="text" className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none" value={newTaskForm.owner} onChange={(e) => setNewTaskForm({...newTaskForm, owner: e.target.value})} placeholder="ชื่อ (ไม่บังคับ)" />
                                    </div>
                                    <button type="submit" className="w-full sm:w-auto bg-gray-800 hover:bg-gray-900 text-white px-5 py-2 rounded-lg font-medium shadow-md flex justify-center items-center h-[38px]">เพิ่มงาน</button>
                                </form>
                            </div>

                            <div className="space-y-4">
                                {isFetchingPlan ? (
                                    <div className="text-center py-16 bg-white rounded-xl border border-gray-100 shadow-sm">
                                        <i data-lucide="loader-2" className="w-8 h-8 animate-spin text-blue-500 mx-auto mb-3"></i>
                                        <p className="text-sm text-gray-500">กำลังโหลดแผนงาน...</p>
                                    </div>
                                ) : tasks.length === 0 ? (
                                    <div className="text-center py-16 bg-white rounded-xl border-2 border-dashed border-gray-200">
                                        <div className="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i data-lucide="clipboard-x" className="w-8 h-8 text-gray-400"></i>
                                        </div>
                                        <h3 className="text-lg font-medium text-gray-900 mb-1">ไม่มีแผนงานในวันนี้</h3>
                                        <p className="text-sm text-gray-500">เริ่มต้นโดยการเพิ่มงานใหม่ แล้วลากพนักงานมาลงได้เลย</p>
                                    </div>
                                ) : tasks.map((task) => {
                                    let badgeColor = "bg-blue-100 text-blue-700 border-blue-200";
                                    let periodText = "เต็มวัน";
                                    if (task.period === "morning") { badgeColor = "bg-orange-100 text-orange-700 border-orange-200"; periodText = "ครึ่งวันเช้า"; }
                                    if (task.period === "afternoon") { badgeColor = "bg-purple-100 text-purple-700 border-purple-200"; periodText = "ครึ่งวันบ่าย"; }

                                    return (
                                        <div key={task.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden group">
                                            <div className="flex flex-col sm:flex-row border-b border-gray-100">
                                                <div className="p-4 sm:p-5 flex-1 flex flex-col justify-center">
                                                    <div className="flex items-start justify-between">
                                                        <div className="flex items-start gap-3 w-full">
                                                            <div className="flex flex-col items-center">
                                                                <span className="bg-gray-800 text-white font-bold px-2 py-1 rounded-md text-sm shadow-sm mb-1.5 flex items-center group/input">
                                                                    #<input type="text" value={task.number} onChange={(e) => handleUpdateTaskField(task.id, 'number', e.target.value)} className="bg-transparent w-8 ml-1 text-white outline-none border-b border-transparent hover:border-gray-500 focus:border-white text-center transition-colors" />
                                                                </span>
                                                                <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${badgeColor} whitespace-nowrap`}>{periodText}</span>
                                                            </div>
                                                            <div className="flex-1 mr-4">
                                                                <input type="text" value={task.name} onChange={(e) => handleUpdateTaskField(task.id, 'name', e.target.value)} className="font-semibold text-gray-800 text-lg leading-tight w-full bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none transition-colors mb-1" placeholder="ระบุชื่องาน..." />
                                                                <div className="flex items-center">
                                                                    <i data-lucide="briefcase" className="w-3.5 h-3.5 mr-1.5 text-gray-400"></i>
                                                                    <span className="text-sm text-gray-500 mr-1">เจ้าของงาน: </span>
                                                                    <input type="text" value={task.owner} onChange={(e) => handleUpdateTaskField(task.id, 'owner', e.target.value)} className="text-sm text-gray-700 font-medium bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none w-48 transition-colors" placeholder="เพิ่มเจ้าของงาน..." />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => handleDeleteTask(task.id)} className="text-gray-400 hover:text-white hover:bg-red-500 p-1.5 rounded-md opacity-0 group-hover:opacity-100 transition-all ml-2" title="ลบกล่องงานนี้">
                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </div>

                                                <div 
                                                    className={`p-4 sm:w-64 border-t sm:border-t-0 sm:border-l border-gray-100 transition-all duration-200 ${dragOverTaskId === task.id ? 'bg-gray-100 shadow-[inset_0_0_0_2px_#cbd5e1]' : 'bg-gray-50/50'}`}
                                                    onDragOver={(e) => { e.preventDefault(); setDragOverTaskId(task.id); }} onDragLeave={() => setDragOverTaskId(null)} onDrop={(e) => handleDrop(e, task.id)}
                                                >
                                                    <div className="text-xs font-bold text-gray-500 mb-2 uppercase flex justify-between items-center">
                                                        <span>ผู้ปฏิบัติงาน</span>
                                                        <span className="bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full text-[10px]">{task.assignees.length} คน</span>
                                                    </div>
                                                    
                                                    <div className={`min-h-[70px] rounded-lg border-2 border-dashed transition-colors ${dragOverTaskId === task.id ? 'border-gray-400 bg-gray-50' : 'border-gray-300 bg-white'} flex flex-wrap gap-2 p-2.5 items-center ${task.assignees.length === 0 ? 'justify-center' : 'justify-start'}`}>
                                                        {task.assignees.length === 0 && <span className="text-xs text-gray-400 text-center pointer-events-none flex flex-col items-center"><i data-lucide="download" className="w-4 h-4 mb-1 opacity-50"></i> ลากมาวาง</span>}
                                                        {task.assignees.map(emp => {
                                                            // ตรวจจับแผนกเพื่อเปลี่ยนสีคนสวน/Cleaning ให้เห็นชัดๆ ภายในกล่องงาน
                                                            const isGardener = !emp.department || emp.department === "คนสวน";
                                                            const badgeColor = !isGardener ? "border-blue-200 text-blue-700" : "border-green-200 text-green-700";
                                                            const iconHover = !isGardener ? "hover:bg-blue-100 hover:text-blue-600" : "hover:bg-green-100 hover:text-green-600";
                                                            
                                                            return (
                                                                <div key={emp.id} className={`bg-white border shadow-sm rounded-full pl-3 pr-1 py-1 text-[13px] font-medium flex items-center gap-1.5 hover:border-gray-400 hover:shadow transition-all ${badgeColor}`}>
                                                                    {emp.name}
                                                                    <button onClick={() => removeAssignee(task.id, emp)} className={`text-gray-400 rounded-full p-0.5 transition-colors ${iconHover}`}>
                                                                        <i data-lucide="x" className="w-3.5 h-3.5"></i>
                                                                    </button>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
