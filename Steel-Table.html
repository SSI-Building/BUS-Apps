<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .table-container { max-height: calc(100vh - 220px); overflow-y: auto; }
        /* Sticky header */
        thead th { position: sticky; top: 0; z-index: 10; background-color: #1f2937; color: white; }
        /* Row Colors */
        .row-available { color: #dc2626; font-weight: 500; } /* สีแดง (มีจำหน่าย) */
        .row-special { color: #111827; font-weight: 500; } /* สีดำ (สั่งพิเศษ) */
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>

            </div>
            <div class="flex items-center text-sm bg-white/10 px-3 py-1 rounded">
                <span class="w-3 h-3 rounded-full bg-black mr-2"></span> สั่งพิเศษ
            </div>
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาขนาด เช่น 100x50" class="pl-10 pr-4 py-2 rounded shadow-sm text-gray-800 w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
    </header>

            <ul id="categoryList" class="flex-1 py-2">
                <!-- Categories will be injected here -->

        </nav>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col relative">
            
            <!-- Category Title & Diagram Area -->

                </div>
                <!-- Diagram Container -->
                <div id="diagramContainer" class="h-24 w-auto object-contain text-blue-900 opacity-80">
                    <!-- SVG Diagram injected here -->
                </div>
            </div>

            <!-- Table Area -->
            <div class="table-container flex-1 bg-gray-50 p-4">

                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead id="tableHeader" class="text-xs uppercase bg-gray-800 text-white">
                            <!-- Headers injected here -->
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-200">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

        // Populate sidebar
        const categoryList = document.getElementById('categoryList');
        let currentCat = "lip-channel"; // Default focus to requested table

        function renderSidebar() {
            categoryList.innerHTML = "";
            for (const key in steelData) {
                const li = document.createElement('li');
                li.className = `cursor-pointer px-6 py-3 border-b text-sm transition-colors duration-150 ${key === currentCat ? 'bg-blue-50 text-blue-700 font-bold border-l-4 border-l-blue-600' : 'text-gray-700 hover:bg-gray-100 border-l-4 border-l-transparent'}`;
                li.innerHTML = `<div class="flex items-center"><i class="fas fa-cube w-5 text-gray-400 mr-2"></i> ${steelData[key].title}</div>`;
                li.onclick = () => selectCategory(key);
                categoryList.appendChild(li);
            }
        }

        function selectCategory(key) {
            currentCat = key;
            renderSidebar();
            renderTable();
        }

        function renderTable(searchTerm = "") {
            const data = steelData[currentCat];
            document.getElementById('currentCategoryTitle').innerText = data.title;
            document.getElementById('currentCategorySub').innerText = data.spec;
            document.getElementById('diagramContainer').innerHTML = data.diagram;
            
            // Header
            const thead = document.getElementById('tableHeader');
            thead.innerHTML = `<tr>${data.headers.map(h => `<th scope="col" class="px-4 py-3 border-b border-gray-300 font-medium tracking-wider text-center">${h}</th>`).join('')}</tr>`;

            // Body
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            
            const filteredData = data.data.filter(row => row.join(' ').toLowerCase().includes(searchTerm.toLowerCase()));

            filteredData.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                const isSpecial = row[row.length - 1] === true;
                const rowClass = isSpecial ? 'row-special bg-gray-50' : 'row-available hover:bg-red-50';
                
                // We omit the last boolean value for display if it's the flag
                const displayRow = (typeof row[row.length - 1] === 'boolean') ? row.slice(0, -1) : row;

                tr.className = `border-b border-gray-100 transition duration-150 ease-in-out ${rowClass}`;
                
                let html = "";
                displayRow.forEach(cell => {
                    html += `<td class="px-4 py-2 text-center border-r border-gray-100">${cell}</td>`;
                });
                
                // Add Copy Button
                html += `<td class="px-4 py-2 text-center">
                    <button onclick='copyRow(${JSON.stringify(displayRow)})' class="text-blue-500 hover:text-blue-700 hover:bg-blue-100 p-1 rounded transition-colors" title="Copy to Excel">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </td>`;
                
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            if(filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${data.headers.length}" class="text-center py-8 text-gray-500">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
            }
        }

        // Copy functionality for Excel (Tab Separated)
        function copyRow(rowData) {
            const tsvData = rowData.join('\t');
            navigator.clipboard.writeText(tsvData).then(() => {
                showToast();
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert("ไม่สามารถคัดลอกข้อมูลได้");
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTable(e.target.value);
        });

        // Init
        renderSidebar();
        renderTable();
    </script>
</body>
</html>
