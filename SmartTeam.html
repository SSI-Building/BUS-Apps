<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวางแผนงานประจำวัน (Drag & Drop + AI)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 🌟 เพิ่มไลบรารี SheetJS สำหรับสร้างไฟล์ Excel 🌟 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
        @keyframes loadingBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
        .animate-loading-bar { animation: loadingBar 1.5s infinite ease-in-out; }

        /* 🌟 Animation สำหรับ AI Panel 🌟 */
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @media (min-width: 768px) {
            .md\\:animate-slide-left { animation: slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbwL-PUhAA0TquLsuI6EnmDer9Dvo13xhCz7oIlXdFCzcxf0dFyY_D9GVKDi44gSoP9kpw/exec";

        const getTodayISO = () => {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        };

        const formatThaiDate = (isoString) => {
            if (!isoString) return "";
            const [year, month, day] = isoString.split('-');
            const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `${parseInt(day, 10)} ${months[parseInt(month, 10) - 1]} ${parseInt(year, 10) + 543}`;
        };

        const formatThaiDateFull = (isoString) => {
            if (!isoString) return "";
            const dateObj = new Date(isoString);
            const days = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
            const [year, month, day] = isoString.split('-');
            const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `${days[dateObj.getDay()]} ที่ ${parseInt(day, 10)} ${months[parseInt(month, 10) - 1]} ${parseInt(year, 10) + 543}`;
        };

        function App() {
            const [allEmployees, setAllEmployees] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [date, setDate] = useState(getTodayISO());
            const [activeTab, setActiveTab] = useState("Cleaning");

            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isSaving, setIsSaving] = useState(false);

            const [newTaskForm, setNewTaskForm] = useState({ number: '', name: '', owner: '', period: 'full' });
            const [dragOverTaskId, setDragOverTaskId] = useState(null);

            // 🌟 State สำหรับระบบ AI Assistant 🌟
            const [isAIPanelOpen, setIsAIPanelOpen] = useState(false);
            const [aiPrompt, setAiPrompt] = useState("");
            const [isGeneratingAI, setIsGeneratingAI] = useState(false);
            const [aiPreviewTasks, setAiPreviewTasks] = useState([]); // เก็บงานที่ AI วิเคราะห์มาไว้ให้เช็คก่อน

            useEffect(() => {
                let cancelled = false;
                const fetchInitData = async () => {
                    try {
                        setIsLoadingData(true);
                        setTasks([]);
                        
                        const response = await fetch(`${API_URL}?action=init&date=${date}&t=${Date.now()}`);
                        const result = await response.json();

                        if (cancelled) return;

                        if (result.success) {
                            if (result.employees) setAllEmployees(result.employees);
                            if (result.plan && result.plan.length > 0) {
                                const taskMap = {};
                                result.plan.forEach(row => {
                                    let pCode = 'full';
                                    if (row.taskPeriod === 'ครึ่งวันเช้า') pCode = 'morning';
                                    if (row.taskPeriod === 'ครึ่งวันบ่าย') pCode = 'afternoon';
                                    const key = `${row.taskNumber}-${row.taskName}-${pCode}`;
                                    if (!taskMap[key]) {
                                        taskMap[key] = {
                                            id: `loaded-${Date.now()}-${Math.random()}`,
                                            number: row.taskNumber, name: row.taskName, owner: row.taskOwner,
                                            period: pCode, assignees: []
                                        };
                                    }
                                    taskMap[key].assignees.push({ id: row.empId, name: row.empName, lineId: row.lineId, department: row.department });
                                });
                                setTasks(Object.values(taskMap));
                            } else setTasks([]);
                        }
                    } catch (error) {
                        console.error("ไม่สามารถดึงข้อมูลได้", error);
                        setTasks([]);
                    } finally {
                        setIsLoadingData(false);
                        setIsInitialLoading(false); 
                    }
                };
                fetchInitData();
                return () => { cancelled = true; };
            }, [date]);

            const getEmployeeStatus = (empId) => {
                let status = { full: false, morning: false, afternoon: false };
                tasks.forEach(task => {
                    if (task.assignees.some(employee => employee.id === empId)) {
                        if (task.period === 'full') status.full = true;
                        if (task.period === 'morning') status.morning = true;
                        if (task.period === 'afternoon') status.afternoon = true;
                    }
                });
                return status;
            };

            const visibleEmployees = allEmployees.filter(employee => {
                if (employee.department !== activeTab) return false;
                const status = getEmployeeStatus(employee.id);
                return !status.full && !(status.morning && status.afternoon);
            });

            // ==========================================
            // 🌟 1. ส่งข้อความให้ AI วิเคราะห์ (ได้ Preview)
            // ==========================================
            const handleAnalyzeAI = async () => {
                if (!aiPrompt.trim()) return;
                setIsGeneratingAI(true);
                try {
                    const response = await fetch(API_URL, {
                        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "generateTasksWithAI", promptText: aiPrompt })
                    });
                    const result = await response.json();
                    
                    if (result.success && result.tasks) {
                        // แมตช์ชื่อพนักงาน แล้วเก็บเข้า Preview
                        const preview = result.tasks.map((t, index) => {
                            const mappedAssignees = [];
                            if (t.assigneeNames && Array.isArray(t.assigneeNames)) {
                                t.assigneeNames.forEach(aiName => {
                                    const matchedEmp = allEmployees.find(emp => 
                                        emp.name.replace(/\s+/g, '') === aiName.replace(/\s+/g, '') ||
                                        emp.name.includes(aiName) || aiName.includes(emp.name)
                                    );
                                    if (matchedEmp) mappedAssignees.push(matchedEmp);
                                });
                            }
                            return {
                                id: `preview-task-${Date.now()}-${index}`,
                                name: t.name || 'งานใหม่',
                                owner: t.owner || '',
                                period: t.period || 'full',
                                assignees: mappedAssignees
                            };
                        });
                        setAiPreviewTasks(preview);
                    } else {
                        alert("AI ไม่สามารถสร้างงานได้: " + (result.message || "เกิดข้อผิดพลาด"));
                    }
                } catch (error) {
                    alert("เชื่อมต่อ AI ไม่สำเร็จ กรุณาลองใหม่");
                } finally {
                    setIsGeneratingAI(false);
                }
            };

            // ==========================================
            // 🌟 2. ยืนยันเอา Preview ลงตารางงานจริง
            // ==========================================
            const handleConfirmAITasks = () => {
                let currentMaxNumber = tasks.length > 0 
                    ? Math.max(...tasks.map(t => parseInt(t.number) || 0)) 
                    : 0;

                const finalTasks = aiPreviewTasks.map(pt => {
                    currentMaxNumber++;
                    return {
                        ...pt,
                        id: `ai-task-${Date.now()}-${Math.random()}`,
                        number: currentMaxNumber.toString()
                    };
                });

                setTasks(prev => [...prev, ...finalTasks]);
                
                // เคลียร์ค่าและปิด Panel
                setAiPreviewTasks([]);
                setAiPrompt("");
                setIsAIPanelOpen(false);
            };

            const handleCancelAIPreview = () => {
                setAiPreviewTasks([]);
            };

            const handleSavePlan = async () => {
                const planData = [];
                const isoDateStr = date; 
                const displayThai = formatThaiDate(date);

                tasks.forEach(task => {
                    if (task.assignees.length > 0) {
                        let periodText = 'เต็มวัน';
                        if (task.period === 'morning') periodText = 'ครึ่งวันเช้า';
                        if (task.period === 'afternoon') periodText = 'ครึ่งวันบ่าย';
                        task.assignees.forEach(emp => {
                            planData.push({
                                empId: emp.id, empName: emp.name, lineId: emp.lineId || "",
                                taskNumber: task.number, taskName: task.name, taskOwner: task.owner,
                                taskPeriod: periodText, workDate: isoDateStr 
                            });
                        });
                    }
                });

                if (planData.length === 0) {
                    if (!confirm(`ตารางงานว่างเปล่า ระบบจะลบข้อมูลของวันที่ ${displayThai} ทิ้ง ยืนยันหรือไม่?`)) return;
                } else {
                    if (!confirm(`ยืนยันการบันทึกแผนงานของวันที่ ${displayThai} ลงระบบ? (ของเก่าจะถูกทับ)`)) return;
                }

                try {
                    setIsSaving(true);
                    const response = await fetch(API_URL, {
                        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "saveWorkPlan", planData: planData, workDate: isoDateStr })
                    });
                    const result = await response.json();
                    if (result.success) alert("อัปเดตและบันทึกข้อมูลเรียบร้อยแล้ว!");
                    else alert("เกิดข้อผิดพลาด: " + result.message);
                } catch (error) {
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTaskForm.number || !newTaskForm.name) return;
                setTasks(prev => [...prev, {
                    id: `task-${Date.now()}`, number: newTaskForm.number, name: newTaskForm.name,
                    owner: newTaskForm.owner, period: newTaskForm.period, assignees: []
                }]);
                setNewTaskForm({ number: '', name: '', owner: '', period: 'full' });
            };

            const handleUpdateTaskField = (taskId, field, value) => {
                setTasks(prev => prev.map(task => task.id === taskId ? { ...task, [field]: value } : task));
            };

            const handleDeleteTask = (taskId) => {
                if (confirm('คุณต้องการลบงานนี้ใช่หรือไม่?')) setTasks(prev => prev.filter(task => task.id !== taskId));
            };

            const handleDragStart = (e, employee) => {
                const empData = { ...employee, department: employee.department || activeTab };
                e.dataTransfer.setData('application/json', JSON.stringify(empData));
            };

            const handleDrop = (e, taskId) => {
                e.preventDefault();
                setDragOverTaskId(null);
                const empStr = e.dataTransfer.getData('application/json');
                if (!empStr) return;

                const employee = JSON.parse(empStr);
                const targetTask = tasks.find(task => task.id === taskId);
                if (!targetTask) return;

                const empStatus = getEmployeeStatus(employee.id);
                if (targetTask.period === 'full' && (empStatus.morning || empStatus.afternoon)) {
                    alert(`ไม่สามารถจัดลงงาน "เต็มวัน" ได้ เนื่องจากมีงานครึ่งวันแล้ว`); return;
                }
                if (targetTask.period === 'morning' && empStatus.morning) { alert(`รับงาน "ช่วงเช้า" ไปแล้ว`); return; }
                if (targetTask.period === 'afternoon' && empStatus.afternoon) { alert(`รับงาน "ช่วงบ่าย" ไปแล้ว`); return; }

                setTasks(prev => prev.map(task => {
                    if (task.id === taskId && !task.assignees.some(emp => emp.id === employee.id)) {
                        return { ...task, assignees: [...task.assignees, employee] };
                    }
                    return task;
                }));
            };

            const removeAssignee = (taskId, employee) => {
                setTasks(prev => prev.map(task => task.id === taskId ? { ...task, assignees: task.assignees.filter(emp => emp.id !== employee.id) } : task));
            };

            const computeRowSpans = (taskList) => {
                let rowSpans = {};
                let skips = {};
                for(let i=0; i<taskList.length; i++) {
                    if(skips[taskList[i].id]) continue;
                    let span = 1;
                    let currA = taskList[i].assignees.map(a=>a.name).sort().join(' + ');
                    if (currA !== "") {
                        for(let j=i+1; j<taskList.length; j++) {
                            let nextA = taskList[j].assignees.map(a=>a.name).sort().join(' + ');
                            if(currA === nextA) { span++; skips[taskList[j].id] = true; } else break;
                        }
                    }
                    rowSpans[taskList[i].id] = span;
                }
                return { rowSpans, skips };
            };

            const handleExportExcel = () => {
                if (tasks.length === 0) { alert("ไม่มีแผนงานให้ส่งออกครับ"); return; }

                const sortedTasks = [...tasks].sort((a, b) => parseInt(a.number || 0) - parseInt(b.number || 0));
                const cleaningTasks = sortedTasks.filter(t => !t.assignees.some(a => a.department === 'คนสวน' || a.department === 'งานคนตัดหญ้า'));
                const gardenTasks = sortedTasks.filter(t => t.assignees.some(a => a.department === 'คนสวน' || a.department === 'งานคนตัดหญ้า'));

                const aoa = []; const merges = []; let currentRow = 0;

                aoa.push(["Cleaning", "", `แผนงานประจำวัน ${formatThaiDateFull(date)}`, ""]);
                merges.push({ s: { r: currentRow, c: 0 }, e: { r: currentRow, c: 1 } }); merges.push({ s: { r: currentRow, c: 2 }, e: { r: currentRow, c: 3 } });
                currentRow++;

                aoa.push(["ลำดับที่", "ชื่องาน", "เจ้าของงาน", "ผู้ปฏิบัติงาน"]); currentRow++;

                const pushTasksToExcel = (taskList) => {
                    const { rowSpans, skips } = computeRowSpans(taskList);
                    let displayCounter = 1;
                    taskList.forEach(task => {
                        const assigneeStr = task.assignees.map(a => a.name).join(' + ');
                        const periodBadge = task.period === 'morning' ? ' (เช้า)' : task.period === 'afternoon' ? ' (บ่าย)' : '';
                        const rowData = [ displayCounter++, task.name + periodBadge, task.owner || "", skips[task.id] ? "" : assigneeStr ];
                        aoa.push(rowData);
                        if (!skips[task.id] && rowSpans[task.id] > 1) {
                            merges.push({ s: { r: currentRow, c: 3 }, e: { r: currentRow + rowSpans[task.id] - 1, c: 3 } });
                        }
                        currentRow++;
                    });
                };

                pushTasksToExcel(cleaningTasks);

                if (gardenTasks.length > 0) {
                    aoa.push(["", "งานคนตัดหญ้า", "", ""]); merges.push({ s: { r: currentRow, c: 1 }, e: { r: currentRow, c: 2 } });
                    currentRow++; pushTasksToExcel(gardenTasks);
                }

                aoa.push(["เรื่องแจ้ง / ประเด็น", "", "", ""]); merges.push({ s: { r: currentRow, c: 0 }, e: { r: currentRow, c: 3 } }); currentRow++;
                aoa.push(["1", "", "", ""]); merges.push({ s: { r: currentRow, c: 1 }, e: { r: currentRow, c: 3 } }); currentRow++;
                aoa.push(["2", "", "", ""]); merges.push({ s: { r: currentRow, c: 1 }, e: { r: currentRow, c: 3 } }); currentRow++;

                const ws = XLSX.utils.aoa_to_sheet(aoa);
                ws['!cols'] = [ { wch: 10 }, { wch: 45 }, { wch: 25 }, { wch: 45 } ];
                ws['!merges'] = merges;
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "WorkPlan");
                XLSX.writeFile(wb, `แผนงานประจำวัน_${date}.xlsx`);
            };

            return (
                <div className="min-h-screen flex flex-col relative pb-20 md:pb-0">

                    {/* =====================================
                        INITIAL LOADING
                    ===================================== */}
                    {isInitialLoading && (
                        <div className="fixed inset-0 z-[9999] bg-slate-50 flex items-center justify-center">
                            <div className="text-center px-6 flex flex-col items-center">
                                <div className="bg-blue-600 p-4 rounded-2xl shadow-lg mb-6 text-white">
                                    <i className="fa-solid fa-clipboard-list text-4xl"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800 tracking-tight mb-2">แผนงานประจำวัน</h2>
                                <p className="text-sm text-slate-500 mb-8">กำลังเตรียมระบบสำหรับการใช้งาน</p>
                                <div className="w-48 h-1 bg-gray-200 rounded-full overflow-hidden relative">
                                    <div className="absolute top-0 bottom-0 left-0 w-1/2 bg-blue-600 rounded-full animate-loading-bar"></div>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2.5 rounded-lg shadow-sm">
                                    <i className="fa-solid fa-clipboard-list text-white text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800 tracking-tight">แผนงานประจำวัน</h1>
                                    <p className="text-sm text-gray-500">สร้าง ดูย้อนหลัง หรือแก้ไขแผนงาน</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 flex-wrap">
                                <div className="flex items-center bg-gray-50 border border-gray-200 px-3 py-2 rounded-lg shadow-sm focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                                    <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="bg-transparent border-none outline-none font-medium text-gray-700 w-36 cursor-pointer" />
                                </div>
                                
                                <button onClick={handleExportExcel} disabled={isLoadingData || isInitialLoading} className="bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-400 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-md flex items-center gap-2">
                                    <i className="fa-solid fa-file-excel"></i> <span className="hidden sm:inline">ส่งออก</span> Excel
                                </button>

                                <button onClick={handleSavePlan} disabled={isSaving || isLoadingData} className="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-md flex items-center gap-2">
                                    {isSaving ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-floppy-disk"></i>}
                                    {isSaving ? "กำลังบันทึก..." : <span className="hidden sm:inline">บันทึกอัปเดต</span>}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col md:flex-row gap-6 lg:gap-8">
                        
                        <div className="w-full md:w-1/3 lg:w-1/4">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-0 sticky top-24 overflow-hidden">
                                <div className="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-gray-800 flex items-center"><i className="fa-solid fa-users text-blue-500 mr-2"></i>พนักงาน</h2>
                                    <span className="text-xs font-semibold bg-gray-200 text-gray-600 px-2 py-1 rounded-md">{formatThaiDate(date)}</span>
                                </div>
                                <div className="flex border-b border-gray-200 bg-white">
                                    <button onClick={() => setActiveTab("Cleaning")} className={`flex-1 py-3 text-sm font-semibold text-center border-b-2 transition-colors duration-200 ${activeTab === "Cleaning" ? "border-blue-500 text-blue-600 bg-blue-50/30" : "border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50"}`}>Cleaning</button>
                                    <button onClick={() => setActiveTab("คนสวน")} className={`flex-1 py-3 text-sm font-semibold text-center border-b-2 transition-colors duration-200 ${activeTab === "คนสวน" ? "border-green-500 text-green-600 bg-green-50/30" : "border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50"}`}>คนสวน</button>
                                </div>
                                <div className="p-4">
                                    <div className="flex flex-wrap gap-2 max-h-[55vh] overflow-y-auto pb-2 pr-1">
                                        {!isInitialLoading && isLoadingData ? (
                                            Array.from({ length: 6 }).map((_, i) => (
                                                <div key={i} className="border px-3 py-3 rounded-lg flex items-center w-[calc(50%-0.25rem)] lg:w-full bg-white border-gray-100 shadow-sm animate-pulse">
                                                    <div className="w-3.5 h-4 bg-slate-200 rounded mr-3"></div><div className="h-3.5 bg-slate-200 rounded w-2/3"></div>
                                                </div>
                                            ))
                                        ) : visibleEmployees.length === 0 ? (
                                            <div className="w-full text-center py-6 text-sm text-gray-500 border border-dashed rounded-lg bg-gray-50">ไม่มีพนักงานว่างในแผนกนี้</div>
                                        ) : (
                                            visibleEmployees.map(employee => {
                                                const status = getEmployeeStatus(employee.id);
                                                const boxColor = employee.department === "Cleaning" ? "bg-blue-50 hover:bg-blue-100 border-blue-200 text-blue-800" : "bg-green-50 hover:bg-green-100 border-green-200 text-green-800";
                                                const iconColor = employee.department === "Cleaning" ? "text-blue-400" : "text-green-500";
                                                return (
                                                    <div key={employee.id} draggable onDragStart={(e) => handleDragStart(e, employee)} className={`border px-3 py-2.5 rounded-lg cursor-grab active:cursor-grabbing flex items-center shadow-sm w-[calc(50%-0.25rem)] lg:w-full group ${boxColor}`}>
                                                        <i className={`fa-solid fa-grip-vertical mr-2 opacity-50 group-hover:opacity-100 ${iconColor}`}></i>
                                                        <span className="font-medium text-sm truncate flex-1">{employee.name}</span>
                                                        {status.morning && <span className="ml-2 text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded font-bold">มีงานเช้า</span>}
                                                        {status.afternoon && <span className="ml-2 text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold">มีงานบ่าย</span>}
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="w-full md:w-2/3 lg:w-3/4 flex flex-col gap-6">
                            
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                                <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center border-b border-gray-100 pb-3"><i className="fa-solid fa-circle-plus text-blue-500 mr-2"></i>เพิ่มงานด้วยตัวเอง</h2>
                                <form onSubmit={handleAddTask} className="flex flex-col sm:flex-row gap-4 items-start sm:items-end">
                                    <div className="w-full sm:w-20">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">หมายเลข</label>
                                        <input type="text" required className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none" value={newTaskForm.number} onChange={(e) => setNewTaskForm({...newTaskForm, number: e.target.value})} placeholder="ลำดับ" />
                                    </div>
                                    <div className="w-full sm:w-32">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">ช่วงเวลา</label>
                                        <select className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none bg-white" value={newTaskForm.period} onChange={(e) => setNewTaskForm({...newTaskForm, period: e.target.value})}>
                                            <option value="full">เต็มวัน</option>
                                            <option value="morning">ครึ่งวันเช้า</option>
                                            <option value="afternoon">ครึ่งวันบ่าย</option>
                                        </select>
                                    </div>
                                    <div className="w-full sm:flex-1">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">ชื่องาน</label>
                                        <input type="text" required className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none" value={newTaskForm.name} onChange={(e) => setNewTaskForm({...newTaskForm, name: e.target.value})} placeholder="รายละเอียดงาน..." />
                                    </div>
                                    <div className="w-full sm:w-40">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">เจ้าของงาน</label>
                                        <input type="text" className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm outline-none" value={newTaskForm.owner} onChange={(e) => setNewTaskForm({...newTaskForm, owner: e.target.value})} placeholder="ชื่อ (ไม่บังคับ)" />
                                    </div>
                                    <button type="submit" className="w-full sm:w-auto bg-gray-800 hover:bg-gray-900 text-white px-5 py-2 rounded-lg font-medium shadow-md flex justify-center items-center h-[38px]">เพิ่มงาน</button>
                                </form>
                            </div>

                            <div className="space-y-4">
                                {!isInitialLoading && isLoadingData ? (
                                    Array.from({ length: 2 }).map((_, i) => (
                                        <div key={i} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden animate-pulse">
                                            <div className="flex flex-col sm:flex-row border-b border-gray-100">
                                                <div className="p-4 sm:p-5 flex-1 flex flex-col justify-center">
                                                    <div className="flex items-start gap-4">
                                                        <div className="w-12 h-8 bg-slate-200 rounded-md"></div>
                                                        <div className="flex-1 space-y-3 mt-1"><div className="h-5 bg-slate-200 rounded w-2/3"></div><div className="h-3 bg-slate-200 rounded w-1/3"></div></div>
                                                    </div>
                                                </div>
                                                <div className="p-4 sm:w-64 border-t sm:border-t-0 sm:border-l border-gray-100">
                                                    <div className="flex justify-between mb-3"><div className="h-3 bg-slate-200 rounded w-20"></div><div className="h-4 w-10 bg-slate-200 rounded-full"></div></div>
                                                    <div className="min-h-[70px] rounded-lg border-2 border-dashed border-gray-200 p-2.5 flex flex-wrap gap-2 items-center"><div className="w-16 h-7 bg-slate-200 rounded-full"></div></div>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                ) : tasks.length === 0 ? (
                                    <div className="text-center py-16 bg-white rounded-xl border-2 border-dashed border-gray-200">
                                        <div className="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-clipboard-question text-gray-400 text-3xl"></i></div>
                                        <h3 className="text-lg font-medium text-gray-900 mb-1">ไม่มีแผนงานในวันที่ {formatThaiDate(date)}</h3>
                                        <p className="text-sm text-gray-500">เริ่มต้นโดยการเพิ่มงานใหม่ แล้วลากพนักงานมาลงได้เลย</p>
                                    </div>
                                ) : [...tasks].sort((a, b) => parseInt(a.number || 0) - parseInt(b.number || 0)).map(task => {
                                    let badgeColor = "bg-blue-100 text-blue-700 border-blue-200";
                                    let periodText = "เต็มวัน";
                                    if (task.period === "morning") { badgeColor = "bg-orange-100 text-orange-700 border-orange-200"; periodText = "ครึ่งวันเช้า"; }
                                    if (task.period === "afternoon") { badgeColor = "bg-purple-100 text-purple-700 border-purple-200"; periodText = "ครึ่งวันบ่าย"; }

                                    return (
                                        <div key={task.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden group hover:border-gray-400 transition-colors">
                                            <div className="flex flex-col sm:flex-row border-b border-gray-100">
                                                <div className="p-4 sm:p-5 flex-1 flex flex-col justify-center">
                                                    <div className="flex items-start justify-between">
                                                        <div className="flex items-start gap-3 w-full">
                                                            <div className="flex flex-col items-center">
                                                                <span className="bg-gray-800 text-white font-bold px-2 py-1 rounded-md text-sm shadow-sm mb-1.5 flex items-center group/input">
                                                                    #<input type="text" value={task.number} onChange={(e) => handleUpdateTaskField(task.id, 'number', e.target.value)} className="bg-transparent w-8 ml-1 text-white outline-none border-b border-transparent hover:border-gray-500 focus:border-white text-center transition-colors" />
                                                                </span>
                                                                <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${badgeColor} whitespace-nowrap`}>{periodText}</span>
                                                            </div>
                                                            <div className="flex-1 mr-4">
                                                                <input type="text" value={task.name} onChange={(e) => handleUpdateTaskField(task.id, 'name', e.target.value)} className="font-semibold text-gray-800 text-lg leading-tight w-full bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none transition-colors mb-1" placeholder="ระบุชื่องาน..." />
                                                                <div className="flex items-center">
                                                                    <i className="fa-solid fa-briefcase text-gray-400 mr-1.5 text-sm"></i>
                                                                    <span className="text-sm text-gray-500 mr-1">เจ้าของงาน: </span>
                                                                    <input type="text" value={task.owner} onChange={(e) => handleUpdateTaskField(task.id, 'owner', e.target.value)} className="text-sm text-gray-700 font-medium bg-transparent border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none w-48 transition-colors" placeholder="เพิ่มเจ้าของงาน..." />
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => handleDeleteTask(task.id)} className="text-gray-400 hover:text-white hover:bg-red-500 p-1.5 rounded-md opacity-0 group-hover:opacity-100 transition-all ml-2" title="ลบกล่องงานนี้"><i className="fa-solid fa-trash-can"></i></button>
                                                    </div>
                                                </div>

                                                <div 
                                                    className={`p-4 sm:w-64 border-t sm:border-t-0 sm:border-l border-gray-100 transition-all duration-200 ${dragOverTaskId === task.id ? 'bg-gray-100 shadow-[inset_0_0_0_2px_#cbd5e1]' : 'bg-gray-50/50'}`}
                                                    onDragOver={(e) => { e.preventDefault(); setDragOverTaskId(task.id); }} onDragLeave={() => setDragOverTaskId(null)} onDrop={(e) => handleDrop(e, task.id)}
                                                >
                                                    <div className="text-xs font-bold text-gray-500 mb-2 uppercase flex justify-between items-center">
                                                        <span>ผู้ปฏิบัติงาน</span><span className="bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full text-[10px]">{task.assignees.length} คน</span>
                                                    </div>
                                                    <div className={`min-h-[70px] rounded-lg border-2 border-dashed transition-colors ${dragOverTaskId === task.id ? 'border-gray-400 bg-gray-50' : 'border-gray-300 bg-white'} flex flex-wrap gap-2 p-2.5 items-center ${task.assignees.length === 0 ? 'justify-center' : 'justify-start'}`}>
                                                        {task.assignees.length === 0 && <span className="text-xs text-gray-400 text-center pointer-events-none flex flex-col items-center"><i className="fa-solid fa-arrow-down mb-1 opacity-50"></i> ลากมาวาง</span>}
                                                        {task.assignees.map(emp => {
                                                            const isGardener = !emp.department || emp.department === "คนสวน";
                                                            const empBadgeColor = !isGardener ? "border-blue-200 text-blue-700" : "border-green-200 text-green-700";
                                                            const iconHover = !isGardener ? "hover:bg-blue-100 hover:text-blue-600" : "hover:bg-green-100 hover:text-green-600";
                                                            return (
                                                                <div key={emp.id} className={`bg-white border shadow-sm rounded-full pl-3 pr-1 py-1 text-[13px] font-medium flex items-center gap-1.5 hover:border-gray-400 hover:shadow transition-all ${empBadgeColor}`}>
                                                                    {emp.name}
                                                                    <button onClick={() => removeAssignee(task.id, emp)} className={`text-gray-400 rounded-full p-0.5 transition-colors ${iconHover}`}><i className="fa-solid fa-xmark"></i></button>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </main>

                    {/* =====================================
                        🌟 FAB BUTTON (ปุ่มลอย AI) 🌟
                    ===================================== */}
                    <button 
                        onClick={() => setIsAIPanelOpen(true)}
                        className="fixed bottom-6 right-6 z-40 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white rounded-full p-4 shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 flex items-center gap-2 group border-4 border-white"
                    >
                        <i className="fa-solid fa-wand-magic-sparkles text-xl group-hover:rotate-12 transition-transform"></i>
                        <span className="hidden md:inline font-bold pr-1">AI จัดงาน</span>
                    </button>

                    {/* =====================================
                        🌟 AI PANEL (Side Panel / Bottom Sheet) 🌟
                    ===================================== */}
                    {isAIPanelOpen && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            {/* Backdrop */}
                            <div 
                                className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" 
                                onClick={() => { setIsAIPanelOpen(false); setAiPreviewTasks([]); setAiPrompt(""); }}
                            ></div>
                            
                            {/* Panel Container */}
                            <div className="relative w-full md:w-[450px] bg-white h-[90vh] md:h-full mt-auto md:mt-0 rounded-t-3xl md:rounded-none md:rounded-l-3xl shadow-2xl flex flex-col animate-slide-up md:animate-slide-left overflow-hidden">
                                
                                {/* Header */}
                                <div className="p-5 border-b border-violet-100 bg-gradient-to-r from-violet-50 to-fuchsia-50 flex justify-between items-center shrink-0">
                                    <div>
                                        <h2 className="text-xl font-bold text-violet-800 flex items-center">
                                            <i className="fa-solid fa-wand-magic-sparkles mr-2 text-violet-600"></i> AI Assistant
                                        </h2>
                                        <p className="text-xs text-violet-600 mt-0.5">วางข้อความงาน แล้วให้ AI ช่วยจัดตาราง</p>
                                    </div>
                                    <button 
                                        onClick={() => { setIsAIPanelOpen(false); setAiPreviewTasks([]); setAiPrompt(""); }} 
                                        className="w-8 h-8 flex justify-center items-center rounded-full bg-white text-gray-500 hover:text-gray-800 shadow-sm"
                                    >
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {/* Body */}
                                <div className="p-5 flex-1 overflow-y-auto bg-gray-50/50">
                                    {aiPreviewTasks.length === 0 ? (
                                        // 1. หน้ากรอกคำสั่ง
                                        <div className="h-full flex flex-col">
                                            <div className="bg-white border border-gray-200 rounded-xl p-4 shadow-sm mb-4">
                                                <h3 className="text-sm font-bold text-gray-700 mb-2">ตัวอย่างข้อความ:</h3>
                                                <div className="text-xs text-gray-500 bg-gray-50 p-3 rounded-lg border border-dashed border-gray-200">
                                                    <p>1. ตัดหญ้าหน้าอาคาร (สมชาย, สมศักดิ์) เต็มวัน</p>
                                                    <p>2. กวาดออฟฟิศช่วงเช้า ให้พี่วิชัยรับผิดชอบ</p>
                                                </div>
                                            </div>

                                            <textarea 
                                                className="w-full flex-1 min-h-[150px] border border-violet-200 rounded-xl p-4 focus:ring-2 focus:ring-violet-400 outline-none text-sm bg-white shadow-inner resize-none"
                                                placeholder="วางข้อความรายละเอียดงาน หรือพิมพ์สั่งงานที่นี่..."
                                                value={aiPrompt}
                                                onChange={e => setAiPrompt(e.target.value)}
                                            ></textarea>

                                            <button 
                                                onClick={handleAnalyzeAI} 
                                                disabled={isGeneratingAI || !aiPrompt.trim()} 
                                                className="mt-4 w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white p-3.5 rounded-xl font-bold shadow-md hover:shadow-lg disabled:opacity-50 transition-all flex items-center justify-center shrink-0"
                                            >
                                                {isGeneratingAI ? <i className="fa-solid fa-spinner fa-spin mr-2"></i> : <i className="fa-solid fa-bolt mr-2"></i>}
                                                {isGeneratingAI ? "กำลังวิเคราะห์ข้อมูล..." : "วิเคราะห์และแยกงาน"}
                                            </button>
                                        </div>
                                    ) : (
                                        // 2. หน้า Preview
                                        <div className="pb-20">
                                            <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                                                <i className="fa-solid fa-eye text-violet-500 mr-2"></i> พรีวิวแผนงาน ({aiPreviewTasks.length} งาน)
                                            </h3>
                                            
                                            <div className="space-y-3">
                                                {aiPreviewTasks.map((task, idx) => {
                                                    let badgeColor = "bg-blue-100 text-blue-700 border-blue-200";
                                                    let periodText = "เต็มวัน";
                                                    if (task.period === "morning") { badgeColor = "bg-orange-100 text-orange-700 border-orange-200"; periodText = "ครึ่งวันเช้า"; }
                                                    if (task.period === "afternoon") { badgeColor = "bg-purple-100 text-purple-700 border-purple-200"; periodText = "ครึ่งวันบ่าย"; }

                                                    return (
                                                        <div key={task.id} className="bg-white border border-gray-200 rounded-xl p-3.5 shadow-sm">
                                                            <div className="flex justify-between items-start mb-2">
                                                                <span className="font-bold text-sm text-gray-800">#{idx + 1} {task.name}</span>
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeColor}`}>{periodText}</span>
                                                            </div>
                                                            {task.owner && <div className="text-xs text-gray-500 mb-2"><i className="fa-solid fa-briefcase mr-1"></i>{task.owner}</div>}
                                                            
                                                            <div className="bg-gray-50 rounded-lg p-2 flex flex-wrap gap-1 mt-2 border border-dashed border-gray-200 min-h-[40px] items-center">
                                                                {task.assignees.length === 0 ? (
                                                                    <span className="text-xs text-gray-400 w-full text-center">ไม่มีผู้ปฏิบัติงานที่ดึงได้</span>
                                                                ) : (
                                                                    task.assignees.map(emp => (
                                                                        <span key={emp.id} className="bg-white border border-gray-200 shadow-sm rounded-md px-2 py-1 text-[11px] font-medium text-gray-700">
                                                                            <i className="fa-solid fa-user text-gray-400 mr-1"></i>{emp.name}
                                                                        </span>
                                                                    ))
                                                                )}
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Footer (สำหรับหน้า Preview) */}
                                {aiPreviewTasks.length > 0 && (
                                    <div className="p-4 border-t bg-white flex gap-3 shrink-0">
                                        <button 
                                            onClick={handleCancelAIPreview} 
                                            className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition-colors text-sm"
                                        >
                                            ยกเลิก
                                        </button>
                                        <button 
                                            onClick={handleConfirmAITasks} 
                                            className="flex-1 bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md text-sm flex items-center justify-center"
                                        >
                                            <i className="fa-solid fa-check mr-2"></i> เพิ่มลงแผนงาน
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
