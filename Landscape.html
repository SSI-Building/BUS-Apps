<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Landscape Maintenance Zones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css" type="text/css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    body { margin: 0; padding: 0; font-family: 'Prompt', sans-serif; background: #EEF2F8; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
    * { box-sizing: border-box; }
    #map { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #F7F8FA; touch-action: manipulation; }
    
    #save-panel, #edit-panel {
        position: absolute; top: 80px; left: 18px; background: rgba(255, 255, 255, 0.95); padding: 15px;
        border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; z-index: 10; width: 310px; max-height: 80vh; overflow-y: auto;
    }
    #edit-panel { background: #34495e; color: white; width: 260px; }
    #save-panel h3, #edit-panel h3 { margin: 0 0 10px 0; font-size: 14px; font-weight: 600; }
    #save-panel input[type="text"], #save-panel input[type="number"], #save-panel select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Prompt'; }
    #save-panel button, #edit-panel button { width: 48%; padding: 10px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; font-family: 'Prompt'; }
    .btn-save { background: #1677FF; color: white; }
    .btn-cancel { background: #e74c3c; color: white; }

    .tool-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .tool-chip { display: inline-block; }
    .tool-chip input[type="checkbox"] { display: none; }
    .tool-chip label { padding: 6px 12px; font-size: 12px; background: #f0f2f5; border: 1px solid #ddd; border-radius: 15px; cursor: pointer; transition: 0.2s; color: #555; user-select: none; display: block; }
    .tool-chip input[type="checkbox"]:checked + label { background: #1677FF; color: white; border-color: #1677FF; font-weight: 500; }

    .fab-container { position: fixed; right: 18px; bottom: 28px; display: flex; flex-direction: column; gap: 15px; z-index: 500; transition: .25s; }
    .fab-hidden { display: none !important; }
    .fab { width: 62px; height: 62px; border-radius: 22px; border: none; background: rgba(255, 255, 255, .92); backdrop-filter: blur(18px); box-shadow: 0 8px 30px rgba(0,0,0,.18); font-size: 22px; color: #1677ff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .2s; }
    .fab:active { transform: scale(.93); }
    .fab-toggle-view { background: #1677FF; color: white; position: relative; }
    .fab-toggle-view .badge { position: absolute; top: -2px; right: -2px; background: #e74c3c; color: white; font-size: 10px; padding: 2px 5px; border-radius: 10px; font-weight: bold; }
    #login-open-btn { background: #34495e; color: white; }
    #login-open-btn.logged-in { background: #2ecc71; color: white; }

    .mobile-bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 52vh; min-height: 100px; max-height: 85vh; display: none; flex-direction: column; background: rgba(255, 255, 255, .96); backdrop-filter: blur(25px); border-radius: 28px 28px 0 0; box-shadow: 0 -15px 40px rgba(0,0,0,.18); z-index: 999; }
    .sheet-handle { width: 100%; height: 32px; display: flex; justify-content: center; align-items: center; cursor: ns-resize; touch-action: none; }
    .sheet-line { width: 70px; height: 6px; border-radius: 30px; background: #D6D8DC; }
    .sheet-header { padding: 4px 24px 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F0F2F5; }
    .sheet-title { font-size: 18px; font-weight: 700; color: #2d3748; }
    .btn-close-sheet { background: #F0F2F5; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 22px; color: #666; cursor: pointer; }
    .sheet-content-wrapper { overflow-y: auto; padding: 12px 24px 24px 24px; flex: 1; }
    
    #data-table { width: 100%; border-collapse: collapse; font-size: 15px; }
    #data-table th { padding: 12px 10px; text-align: left; background: #fff; color: #888; border-bottom: 2px solid #f9f9f9; position: sticky; top: -12px; z-index: 10; }
    #data-table td { padding: 15px 10px; border-bottom: 1px solid #f1f1f1; color: #333; cursor: pointer; }
    #data-table tr { transition: .2s; cursor: pointer; }
    #data-table tr:not(.selected-row):active { background: #f7fafc; }
    #data-table tr.selected-row { background: #EAF3FF !important; border-left: 5px solid #1677FF; }
    .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    .btn-table-report { background: #EAF3FF; border: none; color: #1677FF; font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 10px; transition: .2s; }
    .btn-table-report:active { transform: scale(0.9); background: #1677FF; color: white; }

    .maplibregl-popup { display: none !important; }
    .mobile-report-form { display: flex; flex-direction: column; gap: 12px; padding-top: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #4a5568; }
    .form-group input[type="number"], .form-group input[type="text"] { width: 100%; padding: 12px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 12px; outline: none; font-family: 'Prompt'; }
    .form-group input:focus { border-color: #1677FF; }
    .btn-update-main { width: 100%; margin-top: 10px; height: 52px; border: none; border-radius: 15px; background: #1677FF; color: white; font-size: 16px; font-weight: 600; box-shadow: 0 10px 25px rgba(22,119,255,.25); cursor: pointer; transition: .2s; font-family: 'Prompt'; }
    .btn-update-main:active { transform: scale(.97); }

    /* Custom Radio Buttons */
    .radio-mode { display: flex; gap: 10px; margin-bottom: 5px; }
    .radio-mode label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; background: #f0f2f5; padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; flex: 1; justify-content: center; }
    .radio-mode input[type="radio"] { display: none; }
    .radio-mode input[type="radio"]:checked + span { color: #1677FF; font-weight: bold; }
    .radio-mode label:has(input:checked) { background: #EAF3FF; border-color: #1677FF; }
</style>
</head>
<body>

<!-- ================= หน้าจอ Loading ================= -->
<div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
    <i class="fas fa-spinner fa-spin" style="font-size: 45px; color: #1677FF; margin-bottom: 15px;"></i>
    <span id="loading-text" style="font-size: 16px; font-weight: bold; color: #333;">กำลังเตรียมระบบแผนที่...</span>
</div>

<div id="map"></div>

<div class="fab-container" id="fab-box">
    <button class="fab" id="login-open-btn" title="ระบบสมาชิกพนักงาน"><i class="fas fa-user-lock" id="login-icon"></i></button>
    <button class="fab fab-toggle-view" id="view-mode-btn" title="สลับมุมมองสี"><i class="fas fa-layer-group"></i><span class="badge" id="view-badge">ทีม</span></button>
    <button class="fab fab-table" id="table-open-btn" title="ตารางข้อมูล"><i class="fas fa-list-ul"></i></button>
</div>

<!-- Login Sheet -->
<div id="login-sheet" class="mobile-bottom-sheet" style="height: auto;">
    <div class="sheet-handle" id="login-drag-handle"><div class="sheet-line"></div></div>
    <div class="sheet-header">
        <span class="sheet-title" id="login-sheet-title">ระบบสมาชิกพนักงาน</span>
        <button id="login-close-btn" class="btn-close-sheet">&times;</button>
    </div>
    <div class="sheet-content-wrapper">
        <div id="login-state-profile" style="display:none;" class="mobile-report-form">
            <p id="user-info-display" style="margin:0; font-size:15px; color:#2d3748; line-height:1.6;"></p>
            <button class="btn-update-main" id="btn-logout" style="background:#e74c3c; box-shadow:0 10px 25px rgba(231,76,60,.25);">ออกจากระบบ</button>
        </div>
        <div id="login-state-connecting" style="display:none; text-align:center; padding: 25px 0;">
            <i class="fas fa-spinner fa-spin" style="font-size:32px; color:#1677FF; margin-bottom:12px;"></i>
            <p style="margin:0; font-size:15px; color:#666;">กำลังเชื่อมต่อยืนยันสิทธิ์...</p>
        </div>
        <div id="login-state-register" style="display:none;" class="mobile-report-form">
            <p style="margin:0 0 8px 0; font-size:14px; color:#e74c3c; font-weight:600;"><i class="fas fa-exclamation-circle"></i> ไม่พบข้อมูล กรุณาลงทะเบียน</p>
            <div class="form-group"><label>รหัสพนักงาน <span style="color:red;">*</span></label><input type="text" id="reg-emp-id"></div>
            <div class="form-group"><label>ชื่อ - นามสกุล <span style="color:red;">*</span></label><input type="text" id="reg-emp-name"></div>
            <div class="form-group"><label>ตำแหน่งงาน</label><input type="text" id="reg-emp-pos"></div>
            <input type="hidden" id="reg-line-id">
            <button class="btn-update-main" id="btn-submit-register" style="background:#2ecc71;">บันทึกการลงทะเบียน</button>
        </div>
    </div>
</div>

<!-- Table Sheet -->
<div id="table-sheet" class="mobile-bottom-sheet">
    <div class="sheet-handle" id="table-drag-handle"><div class="sheet-line"></div></div>
    <div class="sheet-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span class="sheet-title">Landscape Zones</span>
            <button id="table-view-toggle" style="background: #1677FF; color: white; border: none; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s;">
                <i class="fas fa-layer-group"></i> <span id="table-view-text">ทีม</span>
            </button>
        </div>
        <button id="table-close-btn" class="btn-close-sheet">&times;</button>
    </div>
    <div id="data-table-wrapper" class="sheet-content-wrapper">
        <table id="data-table">
            <thead><tr><th>ชื่อพื้นที่โซน</th><th id="th-dynamic-status">ผู้รับผิดชอบ</th><th style="text-align: right;" id="th-report-col">รายงาน</th></tr></thead>
            <tbody id="table-tbody"><tr><td colspan="3" style="text-align:center; color:#999; padding:20px;">กำลังดึงข้อมูล...</td></tr></tbody>
        </table>
    </div>
</div>

<!-- ================= Form Sheet ================= -->
<div id="form-sheet" class="mobile-bottom-sheet" style="height: auto;">
    <div class="sheet-handle" id="form-drag-handle"><div class="sheet-line"></div></div>
    <div class="sheet-header">
        <span class="sheet-title" id="form-sheet-title">อัปเดตสถานะงาน</span>
        <button id="form-close-btn" class="btn-close-sheet">&times;</button>
    </div>
    <div class="sheet-content-wrapper">
        <div class="mobile-report-form">
            <div id="weight-info-badge" style="background: #EAF3FF; color: #1677FF; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; display: none; text-align: center; margin-bottom: 5px;">
                <i class="fas fa-balance-scale"></i> สัดส่วนโซน: หญ้า <span id="badge-grass">100</span>% / พุ่มไม้ <span id="badge-shrub">0</span>%
            </div>

            <div class="form-group">
                <label style="color:#1677FF;"><i class="fas fa-tasks"></i> สถานะการทำงานวันนี้:</label>
                <div class="radio-mode">
                    <label>
                        <input type="radio" name="report_mode" value="continue" checked>
                        <span>ตัดต่องานเดิม</span>
                    </label>
                    <label>
                        <input type="radio" name="report_mode" value="finish">
                        <span>ปิดจ๊อบโซนนี้ 100%</span>
                    </label>
                </div>
            </div>

            <div id="report-inputs-container">
                <div class="form-group">
                    <div id="grass-visual-cue" style="font-size:12px; color:#4a5568; background:#f0fdf4; border: 1px solid #c6f6d5; padding:8px; border-radius:8px; margin-bottom:4px; line-height: 1.5;">
                    </div>
                    <label for="input-percent">ระบุตัวเลขเฉพาะ <span style="color:#1677FF; text-decoration: underline;">% ที่เพิ่งทำเสร็จไปวันนี้</span> (ถ้าไม่ได้ทำ ให้เว้นว่างไว้)</label>
                    <input type="number" id="input-percent" placeholder="ตัวอย่าง: ตัดเพิ่ม 20%" min="0" pattern="\d*">
                </div>

                <div class="form-group" id="group-shrub-input" style="display: none; margin-top: 5px;">
                    <div id="shrub-visual-cue" style="font-size:12px; color:#4a5568; background:#fffaf0; border: 1px solid #feebc8; padding:8px; border-radius:8px; margin-bottom:4px; line-height: 1.5;">
                    </div>
                    <label for="input-shrub-percent" style="color: #e67e22;">ระบุตัวเลขเฉพาะ <span style="text-decoration: underline;">% ที่เพิ่งทำเสร็จไปวันนี้</span> (ถ้าไม่ได้ทำ ให้เว้นว่างไว้)</label>
                    <input type="number" id="input-shrub-percent" placeholder="ตัวอย่าง: ตัดเพิ่ม 10%" min="0" pattern="\d*">
                </div>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label for="input-name">ชื่อหัวหน้างานผู้รายงาน</label>
                <input type="text" id="input-name" placeholder="ระบุชื่อผู้ตรวจสอบคุมงาน">
            </div>
            <button class="btn-update-main" id="btn-submit-data">บันทึกส่งรายงาน</button>
        </div>
    </div>
</div>

<!-- ================= Save Panel ================= -->
<div id="save-panel">
    <h3 id="panel-title">บันทึกพื้นที่ใหม่</h3>
    
    <label style="font-size:13px; font-weight:bold; color:#444;">ชื่อโซน / ชื่อพื้นที่:</label>
    <input type="text" id="zone-name" placeholder="เช่น สวนหย่อมหน้าโรงงาน" style="margin-bottom: 15px; margin-top: 5px;" />
    
    <label style="font-size:13px; font-weight:bold; color:#444;">ทีมทำความสะอาด:</label>
    <select id="zone-color" style="margin-bottom: 15px; margin-top: 5px;">
        <option value="#2ecc71">ทีมสีเขียว</option>
        <option value="#f1c40f">ทีมสีเหลือง</option>
    </select>

    <hr style="border: 0; border-top: 1px dashed #ccc; margin: 15px 0;">

    <div style="margin-bottom: 15px; background: #f0fdf4; padding: 12px; border-radius: 8px; border: 1px solid #c6f6d5;">
        <label style="font-size:15px; font-weight:bold; color:#276749; display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="chk-has-grass" checked style="width:18px; height:18px; accent-color:#38a169;"> มีงานตัดหญ้า
        </label>
        
        <div id="grass-settings" style="margin-top:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <label style="font-size:13px; color:#333;">น้ำหนักงาน (%):</label>
                <input type="number" id="weight-grass" value="100" min="0" max="100" style="width:65px; padding:4px; text-align:center; border:1px solid #ddd; border-radius:6px; background:#eee;" readonly>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <label style="font-size:13px; color:#333;">รอบการตัด (วัน):</label>
                <input type="number" id="zone-cycle" placeholder="30" value="30" min="1" style="width:65px; padding:4px; text-align:center; border:1px solid #ddd; border-radius:6px;" />
            </div>
            <label style="font-size:13px; display:block; margin-bottom:6px; color:#333;">เครื่องมือที่ใช้ (เลือกได้มากกว่า 1):</label>
            <div class="tool-chips" id="grass-tools-container">
                <div class="tool-chip"><input type="checkbox" id="gt1" value="รถตัดหญ้านั่งขับ"><label for="gt1">รถนั่งขับ</label></div>
                <div class="tool-chip"><input type="checkbox" id="gt2" value="เครื่องตัดหญ้าสะพาย"><label for="gt2">สะพายบ่า</label></div>
                <div class="tool-chip"><input type="checkbox" id="gt3" value="รถเข็นตัดหญ้า"><label for="gt3">รถเข็น</label></div>
                <div class="tool-chip"><input type="checkbox" id="gt4" value="พร้า"><label for="gt4">พร้า</label></div>
            </div>
        </div>
    </div>

    <div style="margin-bottom: 20px; background: #fffaf0; padding: 12px; border-radius: 8px; border: 1px solid #feebc8;">
        <label style="font-size:15px; font-weight:bold; color:#9c4221; display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="chk-has-shrub" style="width:18px; height:18px; accent-color:#dd6b20;"> มีงานแต่งพุ่มไม้
        </label>
        
        <div id="shrub-settings" style="display: none; margin-top:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <label style="font-size:13px; color:#333;">น้ำหนักงาน (%):</label>
                <input type="number" id="weight-shrub" value="0" min="0" max="100" style="width:65px; padding:4px; text-align:center; border:1px solid #ddd; border-radius:6px; background:#eee;" readonly>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <label style="font-size:13px; color:#333;">รอบการตัด (วัน):</label>
                <input type="number" id="zone-shrub-cycle" placeholder="60" value="60" min="1" style="width:65px; padding:4px; text-align:center; border:1px solid #ddd; border-radius:6px;" />
            </div>
            <label style="font-size:13px; display:block; margin-bottom:6px; color:#333;">เครื่องมือที่ใช้ (เลือกได้มากกว่า 1):</label>
            <div class="tool-chips" id="shrub-tools-container">
                <div class="tool-chip"><input type="checkbox" id="st1" value="เครื่องตัดแต่งพุ่มไม้"><label for="st1">เครื่องแต่งพุ่ม</label></div>
                <div class="tool-chip"><input type="checkbox" id="st2" value="กรรไกรตัดแต่งกิ่ง"><label for="st2">กรรไกรแต่งกิ่ง</label></div>
                <div class="tool-chip"><input type="checkbox" id="st3" value="เลื่อยตัดกิ่งไม้"><label for="st3">เลื่อย</label></div>
            </div>
        </div>
    </div>
    <div style="display: flex; justify-content: space-between;">
        <button class="btn-save" id="btn-save-zone" style="font-size: 15px;">บันทึก</button>
        <button class="btn-cancel" id="btn-cancel-zone" style="font-size: 15px;">ยกเลิก</button>
    </div>
</div>

<div id="edit-panel">
    <h3 style="margin:0 0 10px 0; font-size:14px;">โหมดปรับแต่งพิกัดแนวเขต</h3>
    <p id="edit-zone-display" style="font-size:12px; margin-bottom:10px;"></p>
    <div style="display: flex; justify-content: space-between;">
        <button class="btn-save" id="btn-update-zone">บันทึกตำแหน่งใหม่</button>
        <button class="btn-cancel" id="btn-cancel-edit">ยกเลิก</button>
    </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzZ9MH7fONCkaqgmqWLOM8yAoRm2e4j82x79Lwhpju9k3gz1Uzi9Y4s4ibhwv_bhCnX/exec";
const LIFF_ID = "2007956727-tmpCUfRZ";

// โหมดทดสอบ (VIP เสมอ)
let currentUserRole = 'VIP'; let currentUserName = 'แอดมิน (โหมดทดสอบ)'; let currentUserPos = 'นักพัฒนา';

const targetLngLat = [99.535692, 11.231666];
const map = new maplibregl.Map({
    container: 'map',
    style: { version: 8, sources: { satellite: { type: 'raster', tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'], tileSize: 256 } }, layers: [{ id: 'satellite', type: 'raster', source: 'satellite' }] },
    center: [targetLngLat[0] - (-0.0010), targetLngLat[1] - 0.0010], zoom: 15.58, bearing: -45.6, maxZoom: 21
});

// ฟังก์ชันลากย่อ/ขยาย หน้าต่างตาราง (รองรับ Pointer Events ลื่นๆ)
// ========================================================
function setupDragLogic(sheetElem, handleElem) {
    let isDragging = false;
    let startY, startHeight;

    handleElem.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startY = e.clientY;
        startHeight = parseInt(document.defaultView.getComputedStyle(sheetElem).height, 10);
        handleElem.setPointerCapture(e.pointerId);
        e.preventDefault();
    });

    handleElem.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        let deltaY = startY - e.clientY;
        let newHeight = startHeight + deltaY;
        
        if (newHeight >= 100 && newHeight <= window.innerHeight * 0.85) {
            sheetElem.style.height = newHeight + 'px';
        }
    });

    const stopDrag = (e) => {
        if (!isDragging) return;
        isDragging = false;
        handleElem.releasePointerCapture(e.pointerId);
        localStorage.setItem(sheetElem.id + '_height', sheetElem.style.height);
    };

    handleElem.addEventListener('pointerup', stopDrag);
    handleElem.addEventListener('pointercancel', stopDrag);
}

function handlePolygonClick(lngLat) {

    if(foundIndex === -1) { resetHighlights(); formSheet.style.display = "none"; tableSheet.style.display = "none"; loginSheet.style.display = "none"; document.getElementById("fab-box").classList.remove("fab-hidden"); isBusy = false; return; }

    for(let i=0; i<totalZonesCount; i++) { map.setPaintProperty(`layer-zone-${i}`, "fill-opacity", i === foundIndex ? 0.85 : 0.15); map.setPaintProperty(`layer-zone-${i}-stroke`, "line-width", i === foundIndex ? 5 : 2); }
    const row = document.getElementById(`tr-zone-${foundIndex}`); if(row) { row.classList.add("selected-row"); row.scrollIntoView({ behavior: "smooth", block: "start" }); }
    setTimeout(() => { isBusy = false; }, 300);

let pointerStartX = 0; let pointerStartY = 0;
map.getCanvas().addEventListener("pointerdown", function(e) { pointerStartX = e.clientX; pointerStartY = e.clientY; });
map.getCanvas().addEventListener("pointerup", function(e) { if (isBusy || editingZoneId) return; const moveDistanceX = Math.abs(e.clientX - pointerStartX); const moveDistanceY = Math.abs(e.clientY - pointerStartY); if (moveDistanceX > 6 || moveDistanceY > 6) return; if (draw.getMode() === 'simple_select' || draw.getMode() === 'direct_select') { const rect = map.getCanvas().getBoundingClientRect(); const point = [e.clientX - rect.left, e.clientY - rect.top]; handlePolygonClick(map.unproject(point)); } });
async function fetchWithRetry(url, retries = 3, delay = 2000) { for (let i = 0; i < retries; i++) { try { const response = await fetch(url); if (!response.ok) throw new Error("การตอบรับเน็ตมีปัญหา"); return await response.json(); } catch (err) { if (i === retries - 1) throw err; await new Promise(res => setTimeout(res, delay)); } } }

    if (currentUserRole === 'VIP') { if(drawCtrl) drawCtrl.style.display = 'block'; document.getElementById('login-open-btn').classList.add('logged-in'); document.getElementById('login-icon').className = 'fas fa-user-check'; } else { if(drawCtrl) drawCtrl.style.display = 'none'; if(currentUserRole === 'User') { document.getElementById('login-open-btn').classList.add('logged-in'); document.getElementById('login-icon').className = 'fas fa-user-tie'; } }
    try {
        const zones = await fetchWithRetry(`${WEB_APP_URL}?action=getZones`);
        globalZonesArray = zones; totalZonesCount = zones.length;
        zones.forEach((zone) => { try { zone.coords = JSON.parse(zone.coordinates_data); zone.turfPolygon = turf.polygon([zone.coords]); zone.turfBuffered = turf.buffer(zone.turfPolygon, 8, { units: "meters" }); } catch(jsonErr) {} });
        renderTable();
        zones.forEach((zone, index) => {
            if(!zone.coords) return; const srcId = `source-zone-${index}`; const lyrId = `layer-zone-${index}`;
            const c = (viewMode === 'team') ? (zone.Color || '#2ecc71') : getGrassColor(zone.current_grass_percentage);
            map.addSource(srcId, { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'Polygon', 'coordinates': [zone.coords] } } });
            map.addLayer({ 'id': lyrId, 'type': 'fill', 'source': srcId, 'paint': { 'fill-color': c, 'fill-opacity': 0.5 } });
            map.addLayer({ 'id': `${lyrId}-stroke`, 'type': 'line', 'source': srcId, 'paint': { 'line-color': c, 'line-width': 2 } });
        });
        
        hideLoading();
        
    } catch (err) {
        hideLoading();
        alert("ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณารีเฟรชใหม่อีกครั้งครับ"); 
    }
});
</script>
</body>
</html>
